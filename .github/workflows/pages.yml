# Publish the website (site/ plus the README pictures) to GitHub Pages, with
# its download links pointing at the files of the latest release, and the
# signed apt, dnf/zypper and pacman sources built from that release's Linux
# packages (dist/repo/build.sh).
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'assets/app-icon.svg', 'dist/repo/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp site/* docs/demo.gif docs/screenshot-*.png _site/
          cp assets/app-icon.svg _site/icon.svg
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          sed -i "s/@VERSION@/${tag#v}/g" _site/index.html
          # Every download link must name a file the release has.
          grep -o "releases/download/$tag/[^\"]*" _site/index.html | sed 's|.*/||' | sort -u > linked
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort > attached
          missing=$(comm -23 linked attached)
          if [ -n "$missing" ]; then echo "::error::Not in release $tag: $missing"; exit 1; fi
          echo "$(wc -l < linked) download links, all in $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Package sources
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY_ASC: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends \
            apt-utils createrepo-c rpm pacman-package-manager makepkg libarchive-tools zstd >/dev/null
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D pkgs -p '*.deb' -p '*.rpm' -p '*.pkg.tar.zst'
          # The signing key is an environment secret of github-pages, which
          # only main can deploy to. It lives in a keyring for this step only,
          # gone (agent included) even if signing fails.
          export GNUPGHOME=$(mktemp -d)
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$SIGNING_KEY_ASC" | gpg --batch -q --import
          unset SIGNING_KEY_ASC
          sh dist/repo/build.sh pkgs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
