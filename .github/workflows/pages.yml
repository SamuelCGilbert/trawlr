# Publish the website (site/ plus the README pictures) to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'assets/app-icon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble
        run: |
          mkdir _site
          cp site/* docs/demo.gif docs/screenshot-*.png _site/
          cp assets/app-icon.svg _site/icon.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
