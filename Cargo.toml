[package]
name = "trawlr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Instant file-name search for Linux, Windows and macOS with a live, always-current index"
license = "GPL-3.0-or-later"
authors = ["Sam Gilbert <sam@trawlr.io>"]
homepage = "https://github.com/SamuelCGilbert/trawlr"
repository = "https://github.com/SamuelCGilbert/trawlr"

[lib]
name = "trawlr"
path = "src/lib.rs"

[[bin]]
name = "trawlrd"
path = "src/bin/trawlrd.rs"

[[bin]]
name = "trawlr"
path = "src/bin/trawlr.rs"

[dependencies]
libc = "0.2"
rayon = "1"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
parking_lot = "0.12"
zstd = { version = "0.13", features = ["zstdmt"] }
hashbrown = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
