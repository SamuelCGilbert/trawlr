[package]
name = "trawlr"
version = "0.1.0"
edition = "2021"
description = "Instant file-name search for Linux with a live, always-current index"

[lib]
name = "trawlr"
path = "src/lib.rs"

[[bin]]
name = "trawlrd"
path = "src/bin/trawlrd.rs"

[[bin]]
name = "trawlr"
path = "src/bin/trawlr.rs"

[dependencies]
libc = "0.2"
rayon = "1"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
parking_lot = "0.12"
zstd = { version = "0.13", features = ["zstdmt"] }
hashbrown = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
